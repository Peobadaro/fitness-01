<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="date-nav">
                <button class="back-btn">←</button>
                <h2 id="currentDate">Hoje, 12 de fev. de 2024</h2>
                <button class="calendar-btn">📅</button>
            </div>
            <div class="week-progress">
                <div class="day-circles">
                    <!-- Dias serão inseridos via JavaScript -->
                </div>
            </div>
        </header>

        <main class="summary">
            <h1>Resumo</h1>
            
            <div class="activity-rings">
                <div class="ring-container">
                    <!-- Rings serão inseridos via JavaScript -->
                </div>
            </div>

            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Exercícios</span>
                    <span class="stat-value" id="exerciseTime">0/60</span>
                    <span class="stat-unit">MIN</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Séries</span>
                    <span class="stat-value" id="seriesCount">0/24</span>
                    <span class="stat-unit">TOTAL</span>
                </div>
            </div>

            <div class="workout-plan">
                <h2>Treino do Dia</h2>
                <div id="workoutContainer">
                    <!-- Treino será inserido via JavaScript -->
                </div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="icon">📊</span>
                <span>Resumo</span>
            </button>
            <button class="nav-item">
                <span class="icon">💪</span>
                <span>Treino</span>
            </button>
            <button class="nav-item">
                <span class="icon">👥</span>
                <span>Social</span>
            </button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
