<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="date-header">
                <h2 id="current-date"></h2>
            </div>
            <h1>Summary</h1>
        </header>

        <section class="activity-rings">
            <div class="rings-container">
                <div class="ring move"></div>
                <div class="ring exercise"></div>
                <div class="ring stand"></div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="label">Move</span>
                    <span class="value" style="color: #FF375F">605/600</span>
                    <span class="unit">CAL</span>
                </div>
                <div class="stat-item">
                    <span class="label">Exercise</span>
                    <span class="value" style="color: #96FF5C">42/30</span>
                    <span class="unit">MIN</span>
                </div>
                <div class="stat-item">
                    <span class="label">Stand</span>
                    <span class="value" style="color: #32D8FF">10/6</span>
                    <span class="unit">HRS</span>
                </div>
            </div>
        </section>

        <section class="workout-plan">
            <h2>Workout Plan</h2>
            <div id="workout-container"></div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <span class="icon">📊</span>
                <span>Summary</span>
            </button>
            <button class="nav-item">
                <span class="icon">💪</span>
                <span>Workout</span>
            </button>
            <button class="nav-item">
                <span class="icon">👥</span>
                <span>Share</span>
            </button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
