<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="week-nav">
                <button class="nav-btn">&lt;</button>
                <div class="days-container">
                    <div class="day-circle" data-day="D">D</div>
                    <div class="day-circle" data-day="S">S</div>
                    <div class="day-circle" data-day="T">T</div>
                    <div class="day-circle" data-day="Q">Q</div>
                    <div class="day-circle" data-day="Q">Q</div>
                    <div class="day-circle" data-day="S">S</div>
                    <div class="day-circle" data-day="S">S</div>
                </div>
                <button class="nav-btn">&gt;</button>
            </div>
        </header>

        <main>
            <section class="summary-section">
                <h1>Resumo</h1>
                <div class="activity-rings">
                    <div class="ring-container">
                        <svg class="progress-ring" width="200" height="200">
                            <!-- Rings will be added by JS -->
                        </svg>
                    </div>
                </div>
                
                <div class="metrics">
                    <div class="metric">
                        <span class="label">Exercícios</span>
                        <span class="value">0/6</span>
                    </div>
                    <div class="metric">
                        <span class="label">Tempo</span>
                        <span class="value">0 min</span>
                    </div>
                    <div class="metric">
                        <span class="label">Séries</span>
                        <span class="value">0/24</span>
                    </div>
                </div>
            </section>

            <section class="workout-section">
                <h2>Treino de Hoje</h2>
                <div id="workout-container">
                    <!-- Workout items will be added by JS -->
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">
                <i class="icon">📊</i>
                <span>Resumo</span>
            </button>
            <button class="nav-item">
                <i class="icon">💪</i>
                <span>Treino</span>
            </button>
            <button class="nav-item">
                <i class="icon">👥</i>
                <span>Social</span>
            </button>
        </nav>
    </div>
    <script src="script.js"></script>
</body>
</html>
